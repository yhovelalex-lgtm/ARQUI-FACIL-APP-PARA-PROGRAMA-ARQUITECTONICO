# Publica ARQUI-FÁCIL automáticamente cuando se actualiza main.
name: Publicar ARQUI-FÁCIL en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Verificar relaciones y geometría de matriz
        run: npm run test:matrix
      - name: Compilar para GitHub Pages
        run: npm run build
        env:
          VITE_BASE_PATH: /ARQUI-FACIL-APP-PARA-PROGRAMA-ARQUITECTONICO/
      - name: Verificar salida
        run: test -f dist/index.html
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar versión
        id: deployment
        uses: actions/deploy-pages@v4
